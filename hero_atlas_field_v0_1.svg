<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 800 800"
  width="800"
  height="800"
  aria-hidden="true"
  focusable="false"
>
  <rect
    width="800"
    height="800"
    fill="#FFFFFF"
  />

  <g class="vorneq-hero-field">
    <!-- Thin trajectory 1: top-left -> left-middle -->
    <path
      class="vorneq-traj vorneq-traj--thin"
      d="M 280 130 C 220 200, 185 310, 180 420"
      fill="none"
      stroke="#1F4FD8"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Thin trajectory 2: left-middle -> cyan discovery node -->
    <path
      class="vorneq-traj vorneq-traj--thin"
      d="M 180 420 C 320 360, 460 320, 590 320"
      fill="none"
      stroke="#1F4FD8"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Heavy trajectory: left-middle -> bottom -> signature opening -->
    <path
      class="vorneq-traj vorneq-traj--heavy"
      d="M 180 420
         C 220 560, 340 660, 480 640
         C 570 640, 650 580, 690 500"
      fill="none"
      stroke="#1F4FD8"
      stroke-width="8"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Anchor nodes -->
    <circle
      class="vorneq-node vorneq-node--cobalt"
      cx="280"
      cy="130"
      r="14"
      fill="#1F4FD8"
    />

    <circle
      class="vorneq-node vorneq-node--cobalt"
      cx="180"
      cy="420"
      r="14"
      fill="#1F4FD8"
    />

    <circle
      class="vorneq-node vorneq-node--cobalt"
      cx="480"
      cy="640"
      r="14"
      fill="#1F4FD8"
    />

    <circle
      class="vorneq-node vorneq-node--cyan"
      cx="590"
      cy="320"
      r="14"
      fill="#00BFEA"
    />
  </g>
</svg>