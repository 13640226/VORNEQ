<div class="vq-image__toolbar" role="toolbar" aria-label="{{ labels.heading }}" data-vq-toolbar="{{ scope }}" hidden>
  <a class="vq-image__tool" data-vq-tool="download" download rel="noopener" referrerpolicy="no-referrer">{{ labels.download }}</a>
  <button type="button" class="vq-image__tool" data-vq-tool="share" hidden>{{ labels.share }}</button>
  <button type="button" class="vq-image__tool" data-vq-tool="copy" hidden>{{ labels.copy_image }}</button>
  <button type="button" class="vq-image__tool" data-vq-tool="fullscreen">{{ labels.fullscreen }}</button>
  <p class="vq-image__tool-note" data-vq-tool-note role="status" aria-live="polite"></p>
</div>
