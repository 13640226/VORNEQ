<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 992 1489"
     width="992"
     height="1489"
     role="img"
     aria-labelledby="title desc">

  <title id="title">Saman Kherad — Open Knowledge Field</title>
  <desc id="desc">
    Abstract visual language with an intentionally empty center, independent evidence nodes,
    open paths, distributed relationships and unfinished boundaries.
  </desc>

  <defs>
    <!-- Obsidian background -->
    <radialGradient id="bg" cx="50%" cy="50%" r="78%">
      <stop offset="0%" stop-color="#07090d"/>
      <stop offset="55%" stop-color="#04060a"/>
      <stop offset="100%" stop-color="#010203"/>
    </radialGradient>

    <!-- Empty center -->
    <radialGradient id="void" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="1"/>
      <stop offset="60%" stop-color="#020305" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#07090d" stop-opacity="0"/>
    </radialGradient>

    <!-- Cyan glow -->
    <filter id="cyanGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft line glow -->
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Violet glow -->
    <filter id="violetGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle noise-like pattern -->
    <pattern id="microGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="0.8" fill="#9ee6ff" opacity="0.05"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="992" height="1489" fill="url(#bg)"/>
  <rect width="992" height="1489" fill="url(#microGrid)" opacity="0.7"/>

  <!-- Peripheral atmospheric arcs -->
  <g fill="none" opacity="0.14">
    <path d="M -80 260 C 180 40, 340 100, 470 300"
          stroke="#6f49a8" stroke-width="2"/>
    <path d="M 1060 250 C 810 90, 700 130, 590 300"
          stroke="#78d8ff" stroke-width="2"/>
    <path d="M -120 1210 C 170 1360, 320 1290, 420 1160"
          stroke="#78d8ff" stroke-width="1.5"/>
    <path d="M 1100 1190 C 820 1370, 680 1290, 575 1165"
          stroke="#6f49a8" stroke-width="1.5"/>
  </g>

  <!-- Open paths: none is dominant -->
  <g fill="none"
     stroke-linecap="round"
     stroke-linejoin="round"
     filter="url(#softGlow)">

    <path d="M -40 180
             C 120 300, 210 330, 320 470
             S 395 620, 405 680"
          stroke="#8edfff"
          stroke-width="1.3"
          opacity="0.35"/>

    <path d="M 1030 160
             C 860 280, 760 320, 665 440
             S 600 590, 585 670"
          stroke="#7a4ca8"
          stroke-width="1.1"
          opacity="0.34"/>

    <path d="M -20 1320
             C 120 1190, 210 1090, 330 1010
             S 405 915, 420 825"
          stroke="#d7f3ff"
          stroke-width="1.15"
          opacity="0.27"/>

    <path d="M 1020 1360
             C 860 1220, 780 1110, 665 1030
             S 600 925, 575 830"
          stroke="#8edfff"
          stroke-width="1"
          opacity="0.28"/>

    <path d="M 80 830
             C 210 790, 280 775, 360 760"
          stroke="#9ee6ff"
          stroke-width="0.9"
          stroke-dasharray="5 8"
          opacity="0.25"/>

    <path d="M 920 700
             C 790 720, 720 735, 650 748"
          stroke="#9ee6ff"
          stroke-width="0.9"
          stroke-dasharray="5 8"
          opacity="0.22"/>
  </g>

  <!-- Independent evidence nodes -->
  <g filter="url(#cyanGlow)">
    <circle cx="138" cy="245" r="5" fill="#b7efff" opacity="0.95"/>
    <circle cx="252" cy="388" r="3.5" fill="#8edfff" opacity="0.7"/>
    <circle cx="795" cy="290" r="6" fill="#9ee6ff" opacity="0.8"/>
    <circle cx="864" cy="515" r="3.5" fill="#b7efff" opacity="0.9"/>
    <circle cx="120" cy="905" r="4" fill="#9ee6ff" opacity="0.8"/>
    <circle cx="835" cy="965" r="5" fill="#8edfff" opacity="0.72"/>
    <circle cx="260" cy="1268" r="6" fill="#b7efff" opacity="0.55"/>
    <circle cx="760" cy="1310" r="3.5" fill="#9ee6ff" opacity="0.75"/>
  </g>

  <g filter="url(#violetGlow)">
    <circle cx="365" cy="185" r="7" fill="#7d55ad" opacity="0.65"/>
    <circle cx="675" cy="425" r="4.5" fill="#7d55ad" opacity="0.5"/>
    <circle cx="210" cy="650" r="4" fill="#7d55ad" opacity="0.5"/>
    <circle cx="812" cy="1110" r="5" fill="#7d55ad" opacity="0.42"/>
    <circle cx="395" cy="1190" r="6" fill="#7d55ad" opacity="0.45"/>
  </g>

  <!-- Sparse warm intersections -->
  <g filter="url(#softGlow)">
    <circle cx="338" cy="545" r="2.3" fill="#e8c99d" opacity="0.85"/>
    <circle cx="642" cy="950" r="2.2" fill="#e8c99d" opacity="0.68"/>
    <circle cx="745" cy="615" r="2" fill="#e8c99d" opacity="0.7"/>
  </g>

  <!-- Non-central relationships -->
  <g fill="none"
     stroke="#5f7b8a"
     stroke-width="0.75"
     opacity="0.24"
     filter="url(#softGlow)">

    <line x1="138" y1="245" x2="252" y2="388"/>
    <line x1="252" y1="388" x2="338" y2="545"/>
    <line x1="795" y1="290" x2="675" y2="425"/>
    <line x1="675" y1="425" x2="745" y2="615"/>
    <line x1="120" y1="905" x2="395" y2="1190"/>
    <line x1="835" y1="965" x2="812" y2="1110"/>
    <line x1="395" y1="1190" x2="260" y2="1268"/>
    <line x1="812" y1="1110" x2="760" y2="1310"/>
  </g>

  <!-- Angular evidence fragments -->
  <g fill="none" stroke-width="1" opacity="0.45">
    <polygon points="110,470 145,430 170,485 130,510"
             stroke="#9ee6ff"/>
    <polygon points="800,690 835,645 865,705 820,720"
             stroke="#8edfff"/>
    <polygon points="205,1110 248,1085 260,1135 225,1160"
             stroke="#7d55ad"/>
    <polygon points="735,1180 780,1155 792,1204 755,1228"
             stroke="#9ee6ff"/>
  </g>

  <!-- The intentionally empty center -->
  <ellipse cx="496"
           cy="744"
           rx="190"
           ry="255"
           fill="url(#void)"/>

  <!-- Subtle boundary hints around the center, never closing it -->
  <g fill="none"
     stroke-linecap="round"
     opacity="0.18">

    <path d="M 392 550
             C 355 610, 340 690, 350 745"
          stroke="#78d8ff"
          stroke-width="0.9"/>

    <path d="M 600 552
             C 640 615, 655 690, 645 742"
          stroke="#7d55ad"
          stroke-width="0.9"/>

    <path d="M 365 850
             C 392 900, 420 925, 448 945"
          stroke="#78d8ff"
          stroke-width="0.8"/>

    <path d="M 625 850
             C 600 900, 570 928, 545 947"
          stroke="#7d55ad"
          stroke-width="0.8"/>
  </g>

  <!-- Outer unfinished network -->
  <g fill="none"
     stroke="#18303a"
     stroke-width="1"
     opacity="0.34">

    <path d="M -50 120 L 180 310 L 420 410"/>
    <path d="M 1040 220 L 820 340 L 650 470"/>
    <path d="M -40 1180 L 220 1030 L 355 930"/>
    <path d="M 1030 1260 L 815 1110 L 650 1005"/>
  </g>

  <!-- No element occupies the center -->
</svg>