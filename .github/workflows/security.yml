name: Security Audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install audit tooling
        run: |
          # Interim hardening: binary wheels only, no unrestricted pip upgrade.
          # Full transitive hash lock and isolated install remain required before CI approval.
          python -m pip install --no-cache-dir --only-binary=:all: -r requirements-security.txt
      - name: Audit Python dependencies
        run: python -m pip_audit --requirement requirements-audit.lock --require-hashes --disable-pip
