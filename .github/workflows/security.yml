name: Security Audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # P0 candidate mitigation; runtime enforcement still requires independent evidence.
      - name: Block unapproved outbound endpoints (before checkout)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
            archive.ubuntu.com:80
            security.ubuntu.com:80
            pypi.org:443
            files.pythonhosted.org:443
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-security.txt
      - name: Install audit tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-security.txt
      - name: Audit Python dependencies
        run: python -m pip_audit --requirement requirements.txt
