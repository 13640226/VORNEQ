name: Security Audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Downloading is the only network-enabled dependency acquisition step.
      # Egress allowlisting for this phase remains an open security review item.
      - name: Download hash-verified audit wheels
        run: |
          mkdir -p "$RUNNER_TEMP/security-wheels"
          chmod 777 "$RUNNER_TEMP/security-wheels"
          docker run --rm --cap-drop ALL --security-opt no-new-privileges \
            --network bridge --user 65534:65534 \
            --mount "type=bind,src=$PWD,dst=/src,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/security-wheels,dst=/wheels" \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m \
            python:3.12-slim-bookworm \
            sh -c 'python -m pip download --disable-pip-version-check --no-cache-dir --require-hashes --only-binary=:all: -r /src/requirements-security.lock -d /wheels'
          test -n "$(find "$RUNNER_TEMP/security-wheels" -maxdepth 1 -name '*.whl' -print -quit)"

      - name: Offline install of audit tools (no network)
        run: |
          mkdir -p "$RUNNER_TEMP/security-tools"
          chmod 777 "$RUNNER_TEMP/security-tools"
          docker run --rm --network none --cap-drop ALL \
            --security-opt no-new-privileges --user 65534:65534 \
            --mount "type=bind,src=$PWD,dst=/src,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/security-wheels,dst=/wheels,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/security-tools,dst=/tools" \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m \
            python:3.12-slim-bookworm \
            sh -c 'python -m pip install --disable-pip-version-check --no-index --find-links=/wheels --require-hashes --only-binary=:all: --target /tools -r /src/requirements-security.lock'

      # The advisory lookup needs outbound HTTPS. This step deliberately uses
      # a separate no-secrets, read-only container; domain-level egress control
      # remains REQUIRED before final security approval.
      - name: Audit Python dependencies
        run: |
          docker run --rm --network bridge --cap-drop ALL \
            --security-opt no-new-privileges --read-only --user 65534:65534 \
            --mount "type=bind,src=$PWD,dst=/src,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/security-tools,dst=/tools,readonly" \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m \
            -e PYTHONPATH=/tools -e HOME=/tmp \
            python:3.12-slim-bookworm \
            python -m pip_audit --requirement /src/requirements-audit.lock --require-hashes --disable-pip
