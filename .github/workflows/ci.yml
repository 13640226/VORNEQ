name: CI

on:
  push:
    branches: [main, develop, "test/**"]
  pull_request:
    branches: [main]

# Explicit minimum privilege for all CI jobs.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VORNEQ_ENV: development
      DJANGO_SECRET_KEY: ci-only-secret
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost,http://127.0.0.1
      DATABASE_URL: ""
      REDIS_URL: ""
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      # P0 candidate mitigation; runtime enforcement still requires independent evidence.
      - name: Block unapproved outbound endpoints (before checkout)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
            archive.ubuntu.com:80
            security.ubuntu.com:80
            pypi.org:443
            files.pythonhosted.org:443
      - name: Preflight development SQLite configuration (before checkout)
        shell: bash
        run: |
          set -euo pipefail
          test "$VORNEQ_ENV" = "development"
          test -z "${DATABASE_URL:-}"
          test -z "${REDIS_URL:-}"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Verify isolated CI identity before dependency execution
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = "pull_request" -o "${GITHUB_EVENT_NAME}" = "push"
          test "${VORNEQ_ENV}" = "development"
          test -z "${REDIS_URL:-}"
          if [ -n "${DATABASE_URL:-}" ]; then
            test "${DATABASE_URL}" = "postgres://vorneq:vorneq@localhost:5432/vorneq"
          fi
          test "${GITHUB_ACTIONS}" = "true"
      - name: Verify local PostgreSQL configuration before migration
        if: matrix.python-version == '3.11' || matrix.python-version == '3.12'
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${DATABASE_URL:-}" ]; then
            python - <<'PY'
          import os, urllib.parse
          url = urllib.parse.urlparse(os.environ["DATABASE_URL"])
          assert url.hostname == "localhost" and url.port == 5432
          assert url.path == "/vorneq" and url.username == "vorneq"
          PY
          fi
      - name: Install OS translation tooling (privileged phase)
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext
      - name: Verify privilege boundary before Python package installation
        shell: bash
        run: |
          set -euo pipefail
          test "$VORNEQ_ENV" = "development"
          test -z "${REDIS_URL:-}"
      - name: Install Python dependencies (unprivileged command)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile translations
        run: python manage.py compilemessages
      - name: Django system check
        run: python manage.py check
      - name: Check migration drift
        run: python manage.py makemigrations --check --dry-run
      - name: Collect static files
        run: python manage.py collectstatic --noinput
      - name: Run tests
        run: python manage.py test

  test-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VORNEQ_ENV: development
      DJANGO_SECRET_KEY: ci-only-secret
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost,http://127.0.0.1
      DATABASE_URL: postgres://vorneq:vorneq@localhost:5432/vorneq
      REDIS_URL: ""
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vorneq
          POSTGRES_PASSWORD: vorneq
          POSTGRES_DB: vorneq
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      # P0 candidate mitigation; runtime enforcement still requires independent evidence.
      - name: Block unapproved outbound endpoints (before checkout)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
            archive.ubuntu.com:80
            security.ubuntu.com:80
            pypi.org:443
            files.pythonhosted.org:443
      - name: Preflight ephemeral PostgreSQL binding (before checkout)
        shell: bash
        run: |
          set -euo pipefail
          test "$VORNEQ_ENV" = "development"
          test "$DATABASE_URL" = "postgres://vorneq:vorneq@localhost:5432/vorneq"
          test -z "${REDIS_URL:-}"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile translations
        run: python manage.py compilemessages
      - name: Django system check
        run: python manage.py check
      - name: Apply migrations
        run: python manage.py migrate --noinput
      - name: Check migration drift
        run: python manage.py makemigrations --check --dry-run
      - name: Collect static files
        run: python manage.py collectstatic --noinput
      - name: Run tests
        run: python manage.py test
