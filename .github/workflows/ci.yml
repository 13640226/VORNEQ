name: CI

on:
  push:
    branches: [main, develop, "test/**"]
  pull_request:
    branches: [main]

# PR checks use a read-only GITHUB_TOKEN and local test fixtures only.
permissions:
  contents: read

# CI-01 / CI-02 / CI-03 (CI security architecture V2):
# - Steps on the runner only orchestrate Docker; they never execute project code.
# - Wheels are downloaded by pip from requirements-ci.lock with --require-hashes
#   and --only-binary (no build hooks, no project code).
# - Project code runs in a digest-pinned container as uid 1001, with all
#   capabilities dropped, no-new-privileges, no Docker socket, no credentials,
#   and no internet: --network none (test) or an --internal network that only
#   reaches the disposable PostgreSQL (test-postgres).

jobs:
  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python-version: "3.11"
            image: python:3.11-bookworm@sha256:84fa927127b46670e768371d1ad1be271d57ba93a6fbb3479045c7c6c452432f
          - python-version: "3.12"
            image: python:3.12-bookworm@sha256:a5bab0ff300f91231c2e68bf73a8a8d60762ac39ce1c50eaf6803e4c38a9062b
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download hash-pinned wheels (network; no project code runs)
        run: |
          mkdir -p "$RUNNER_TEMP/wheels"
          chmod 0777 "$RUNNER_TEMP/wheels"
          docker run --rm --user 1001:1001 -e HOME=/tmp \
            -v "$RUNNER_TEMP/wheels:/w" \
            -v "$GITHUB_WORKSPACE/requirements-ci.lock:/lock:ro" \
            "${{ matrix.image }}" \
            python -m pip download --no-cache-dir --only-binary=:all: --require-hashes -r /lock -d /w
      - name: Run checks and tests without network (CI-02)
        run: |
          docker run --rm --network none --user 1001:1001 \
            --cap-drop ALL --security-opt no-new-privileges \
            -e VORNEQ_ENV=development \
            -e DJANGO_SECRET_KEY=ci-only-secret \
            -e DJANGO_DEBUG=1 \
            -e DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,testserver \
            -e DJANGO_CSRF_TRUSTED_ORIGINS=http://localhost,http://127.0.0.1 \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            -v "$RUNNER_TEMP/wheels:/w:ro" \
            -v "$GITHUB_WORKSPACE/requirements-ci.lock:/lock:ro" \
            "${{ matrix.image }}" sh /src/scripts/ci_offline_tests.sh

  test-postgres:
    name: test-postgres (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python-version: "3.11"
            image: python:3.11-bookworm@sha256:84fa927127b46670e768371d1ad1be271d57ba93a6fbb3479045c7c6c452432f
          - python-version: "3.12"
            image: python:3.12-bookworm@sha256:a5bab0ff300f91231c2e68bf73a8a8d60762ac39ce1c50eaf6803e4c38a9062b
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download hash-pinned wheels (network; no project code runs)
        run: |
          mkdir -p "$RUNNER_TEMP/wheels"
          chmod 0777 "$RUNNER_TEMP/wheels"
          docker run --rm --user 1001:1001 -e HOME=/tmp \
            -v "$RUNNER_TEMP/wheels:/w" \
            -v "$GITHUB_WORKSPACE/requirements-ci.lock:/lock:ro" \
            "${{ matrix.image }}" \
            python -m pip download --no-cache-dir --only-binary=:all: --require-hashes -r /lock -d /w
      - name: Start disposable PostgreSQL on an internal network
        run: |
          docker network create --internal ci-db
          docker run -d --name ci-postgres --network ci-db --network-alias postgres \
            -e POSTGRES_USER=vorneq -e POSTGRES_PASSWORD=vorneq -e POSTGRES_DB=vorneq \
            --health-cmd "pg_isready -U vorneq -d vorneq" --health-interval 2s --health-retries 30 \
            postgres:16@sha256:5db6dac2ef5dcff512f4f00a009c3c332b9f2f28f24277175bf3e4a3d02ef83a
          for i in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' ci-postgres)" = "healthy" ] && break
            sleep 2
          done
          test "$(docker inspect -f '{{.State.Health.Status}}' ci-postgres)" = "healthy"
      - name: Run checks and tests without internet (CI-02)
        run: |
          docker run --rm --network ci-db --user 1001:1001 \
            --cap-drop ALL --security-opt no-new-privileges \
            -e VORNEQ_ENV=development \
            -e DJANGO_SECRET_KEY=ci-only-secret \
            -e DJANGO_DEBUG=1 \
            -e DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,testserver \
            -e DJANGO_CSRF_TRUSTED_ORIGINS=http://localhost,http://127.0.0.1 \
            -e DATABASE_URL=postgres://vorneq:vorneq@postgres:5432/vorneq \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            -v "$RUNNER_TEMP/wheels:/w:ro" \
            -v "$GITHUB_WORKSPACE/requirements-ci.lock:/lock:ro" \
            "${{ matrix.image }}" sh /src/scripts/ci_offline_tests.sh
      - name: Remove disposable PostgreSQL
        if: always()
        run: |
          docker rm -f ci-postgres || true
          docker network rm ci-db || true
