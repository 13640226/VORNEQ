name: CI

on:
  push:
    branches: [main, develop, "test/**"]
  pull_request:
    branches: [main]

# PR checks use a read-only GITHUB_TOKEN and local test fixtures only.
permissions:
  contents: read

# CI-01 / AC-CI2-04: project code and dependencies run inside a digest-pinned
# container as an unprivileged user (uid 1001, no sudo). No privileged
# preparation step shares the job with untrusted code. Translations are
# compiled with Babel instead of GNU gettext, so no OS package install is needed.

jobs:
  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
      options: --user 1001:1001
    env:
      VORNEQ_ENV: development
      DJANGO_SECRET_KEY: ci-only-secret
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost,http://127.0.0.1
    strategy:
      matrix:
        include:
          - python-version: "3.11"
            image: python:3.11-bookworm@sha256:84fa927127b46670e768371d1ad1be271d57ba93a6fbb3479045c7c6c452432f
          - python-version: "3.12"
            image: python:3.12-bookworm@sha256:a5bab0ff300f91231c2e68bf73a8a8d60762ac39ce1c50eaf6803e4c38a9062b
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify unprivileged runtime
        run: |
          python --version
          test "$(id -u)" != "0"
          if command -v sudo >/dev/null 2>&1; then echo "sudo present" >&2; exit 1; fi
      - name: Install dependencies (virtualenv, no root)
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/venv/bin/python" -m pip install -r requirements.txt "babel==2.16.0"
      - name: Compile translations (Babel)
        run: |
          set -eu
          for po in $(find . -path ./node_modules -prune -o -name django.po -print); do
            pybabel compile -i "$po" -o "${po%.po}.mo"
          done
      - name: Django system check
        run: python manage.py check
      - name: Check migration drift
        run: python manage.py makemigrations --check --dry-run
      - name: Collect static files
        run: python manage.py collectstatic --noinput
      - name: Run tests
        run: python manage.py test

  test-postgres:
    name: test-postgres (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
      options: --user 1001:1001
    env:
      VORNEQ_ENV: development
      DJANGO_SECRET_KEY: ci-only-secret
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost,http://127.0.0.1
      DATABASE_URL: postgres://vorneq:vorneq@postgres:5432/vorneq
    services:
      postgres:
        image: postgres:16@sha256:5db6dac2ef5dcff512f4f00a009c3c332b9f2f28f24277175bf3e4a3d02ef83a
        env:
          POSTGRES_USER: vorneq
          POSTGRES_PASSWORD: vorneq
          POSTGRES_DB: vorneq
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      matrix:
        include:
          - python-version: "3.11"
            image: python:3.11-bookworm@sha256:84fa927127b46670e768371d1ad1be271d57ba93a6fbb3479045c7c6c452432f
          - python-version: "3.12"
            image: python:3.12-bookworm@sha256:a5bab0ff300f91231c2e68bf73a8a8d60762ac39ce1c50eaf6803e4c38a9062b
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify unprivileged runtime
        run: |
          python --version
          test "$(id -u)" != "0"
          if command -v sudo >/dev/null 2>&1; then echo "sudo present" >&2; exit 1; fi
      - name: Install dependencies (virtualenv, no root)
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/venv/bin/python" -m pip install -r requirements.txt "babel==2.16.0"
      - name: Compile translations (Babel)
        run: |
          set -eu
          for po in $(find . -path ./node_modules -prune -o -name django.po -print); do
            pybabel compile -i "$po" -o "${po%.po}.mo"
          done
      - name: Django system check
        run: python manage.py check
      - name: Verify disposable database identity before any write (Z4)
        run: |
          python - <<'EOF'
          import ipaddress, os, sys
          from urllib.parse import urlparse
          import psycopg2
          url = os.environ["DATABASE_URL"]
          host = urlparse(url).hostname
          if host != "postgres":
              sys.exit(f"DATABASE_URL host {host!r} is not the job service alias 'postgres'")
          with psycopg2.connect(url) as conn, conn.cursor() as cur:
              cur.execute("SELECT current_database(), current_user, host(inet_server_addr())")
              db, user, addr = cur.fetchone()
          print(f"identity: {db}|{user}|{addr}")
          if (db, user) != ("vorneq", "vorneq"):
              sys.exit(f"unexpected database identity {db}/{user}")
          ip = ipaddress.ip_address(addr)
          if not ip.is_private or ip.is_loopback:
              sys.exit(f"database address {addr} is not a private job-network address")
          EOF
      - name: Apply migrations
        run: python manage.py migrate --noinput
      - name: Check migration drift
        run: python manage.py makemigrations --check --dry-run
      - name: Collect static files
        run: python manage.py collectstatic --noinput
      - name: Run tests
        run: python manage.py test
