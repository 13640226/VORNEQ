name: V-01 Docker Local Image Inventory One-Shot

on:
  push:
    branches:
      - diagnostics/v01-runner-isolation-one-shot-20261010
    paths:
      - '.github/workflows/v01-runner-isolation-one-shot.yml'

permissions: {}

jobs:
  runner-image-inventory:
    if: github.event_name == 'push' && github.ref == 'refs/heads/diagnostics/v01-runner-isolation-one-shot-20261010'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read existing local Docker image inventory only
        shell: bash
        run: |
          set -euo pipefail
          printf 'diagnostic=V-01 local Docker image inventory read-only\n'
          printf 'run_id=%s\n' "${GITHUB_RUN_ID:-unknown}"
          printf 'runner_os=%s\n' "${RUNNER_OS:-unknown}"
          printf 'runner_image_os=%s\n' "${ImageOS:-unknown}"
          printf 'runner_image_version=%s\n' "${ImageVersion:-unknown}"
          printf 'docker_server_version='
          docker version --format '{{.Server.Version}}'
          printf 'image_inventory_begin\n'
          docker image ls --no-trunc --digests --format 'repository={{.Repository}} tag={{.Tag}} id={{.ID}} digest={{.Digest}} size={{.Size}}'
          printf 'image_inventory_end\n'
          mapfile -t image_ids < <(docker image ls --quiet --no-trunc | sort -u)
          printf 'unique_local_image_count=%s\n' "${#image_ids[@]}"
          inspected=0
          for image_id in "${image_ids[@]}"; do
            if (( inspected >= 20 )); then
              printf 'image_metadata_limit_reached=yes\n'
              break
            fi
            docker image inspect --format 'image_metadata=id={{.Id}} os={{.Os}} arch={{.Architecture}} size={{.Size}} repo_tags={{json .RepoTags}} repo_digests={{json .RepoDigests}}' "$image_id"
            inspected=$((inspected + 1))
          done
          printf 'inspected_image_count=%s\n' "$inspected"
          printf 'containers_created=no\n'
          printf 'images_pulled=no\n'
          printf 'images_built=no\n'
          printf 'inventory_only_complete=yes\n'
