name: Global Quality Verification

on:
  pull_request:
    # Only governance-only changes may skip optional quality verification.
    # Workflow changes MUST remain in scope for security review.
    paths-ignore:
      - "docs/governance/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-verification:
    # Pinned runner: Playwright 1.55.1 cannot install Chromium on Ubuntu 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VORNEQ_ENV: development
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: quality-verification-only
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost
      DJANGO_CSRF_TRUSTED_ORIGINS: http://127.0.0.1:8000,http://localhost:8000
      QUALITY_BASE_URL: http://127.0.0.1:8000
      QUALITY_OUT_DIR: artifacts/quality
      DATABASE_URL: ""
      REDIS_URL: ""

    steps:
      # P0 candidate mitigation; runtime enforcement still requires independent evidence.
      - name: Block unapproved outbound endpoints (before checkout)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
            archive.ubuntu.com:80
            security.ubuntu.com:80
            pypi.org:443
            files.pythonhosted.org:443
            registry.npmjs.org:443
            nodejs.org:443
            cdn.playwright.dev:443
            playwright.azureedge.net:443
            storage.googleapis.com:443
            results-receiver.actions.githubusercontent.com:443
            '*.blob.core.windows.net:443'
      # GitHub Actions artifact transport destinations are explicitly allowed above.
      - name: Preflight local-only quality configuration (before checkout)
        shell: bash
        run: |
          set -euo pipefail
          test "$VORNEQ_ENV" = "development"
          test -z "${DATABASE_URL:-}"
          test -z "${REDIS_URL:-}"
          test "$QUALITY_BASE_URL" = "http://127.0.0.1:8000"
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify isolated quality runner before dependency execution
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_ACTIONS}" = "true"
          test "${VORNEQ_ENV}" = "development"
          test -z "${DATABASE_URL:-}"
          test -z "${REDIS_URL:-}"
          test "${QUALITY_BASE_URL}" = "http://127.0.0.1:8000"
      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install verification dependencies
        working-directory: quality
        run: npm install --no-audit --no-fund

      - name: Install browser
        working-directory: quality
        run: npx playwright install --with-deps chromium

      - name: Self-test verification contract
        working-directory: quality
        run: npm test

      - name: Prepare application database
        run: python manage.py migrate --noinput

      - name: Start application
        run: |
          python manage.py runserver 127.0.0.1:8000 > /tmp/vorneq-quality-server.log 2>&1 &
          echo $! > /tmp/vorneq-quality-server.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/en/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/vorneq-quality-server.log
          exit 1

      - name: Run browser, accessibility, SEO and i18n verification
        working-directory: quality
        run: npm run verify

      - name: Run Lighthouse lab measurements
        working-directory: quality
        run: npm run lighthouse

      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: global-quality-verification-${{ github.run_id }}
          path: quality/artifacts/quality/
          retention-days: 14
          if-no-files-found: error

      - name: Show application log on infrastructure failure
        if: failure()
        run: cat /tmp/vorneq-quality-server.log || true
