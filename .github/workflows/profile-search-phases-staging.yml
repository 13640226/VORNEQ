name: Profile Staging Search Phases

on:
  workflow_dispatch:
    inputs:
      repeat:
        description: Number of repetitions per query
        required: false
        default: "20"
      interleaved:
        description: Run query scenarios round-robin to reduce time-order drift
        required: false
        default: false
        type: boolean
      compare:
        description: Compare window-count baseline vs production with alternating order
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify staging database secret
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          if [ -z "$STAGING_DATABASE_URL" ]; then
            echo "STAGING_DATABASE_URL is not configured in GitHub Actions secrets." >&2
            exit 1
          fi

      - name: Check migration status
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DJANGO_SETTINGS_MODULE: config.settings_render
        run: |
          python manage.py showmigrations --plan

      - name: Profile search path
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DJANGO_SETTINGS_MODULE: config.settings_render
          INTERLEAVED: ${{ inputs.interleaved }}
          COMPARE: ${{ inputs.compare }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$INTERLEAVED" = "true" ]; then
            flags+=("--interleaved")
          fi
          if [ "$COMPARE" = "true" ]; then
            flags+=("--compare")
          fi
          python manage.py profile_search_phases \
            --query "" \
            --query "ai" \
            --query "knowledge" \
            --query "science" \
            --repeat "${{ inputs.repeat }}" \
            "${flags[@]}" \
            --json | tee search_phase_profile.jsonl

      - name: Validate profiler JSONL
        env:
          INTERLEAVED: ${{ inputs.interleaved }}
          COMPARE: ${{ inputs.compare }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("search_phase_profile.jsonl")
          rows = [json.loads(line) for line in path.read_text().splitlines() if line.strip()]
          expected_interleaved = os.environ.get("INTERLEAVED", "false").lower() == "true"
          expected_compare = os.environ.get("COMPARE", "false").lower() == "true"
          expected_rows = 8 if expected_compare else 4
          if len(rows) != expected_rows:
              raise SystemExit(f"Expected {expected_rows} profiler rows, found {len(rows)}")

          required = {
              "mode",
              "total",
              "avg_db_queries",
              "total_results",
              "interleaved",
              "compare",
          }
          modes = {row["mode"] for row in rows}
          expected_modes = {"baseline", "production"} if expected_compare else {"production"}
          if modes != expected_modes:
              raise SystemExit(f"Unexpected profiler modes: {sorted(modes)}")

          for row in rows:
              missing = required - row.keys()
              if missing:
                  raise SystemExit(f"Profiler row missing fields: {sorted(missing)}")
              if row["interleaved"] != expected_interleaved:
                  raise SystemExit(
                      f"Interleaved mode mismatch: expected {expected_interleaved}, "
                      f"got {row['interleaved']}"
                  )
              if row["compare"] != expected_compare:
                  raise SystemExit(
                      f"Compare mode mismatch: expected {expected_compare}, got {row['compare']}"
                  )
              if expected_compare and row.get("equivalent") is not True:
                  raise SystemExit("Comparison row did not report equivalence")
              for percentile in ("p50_ms", "p95_ms", "p99_ms"):
                  if percentile not in row["total"]:
                      raise SystemExit(f"Profiler row missing total.{percentile}")

          print(f"Validated {expected_rows} search profiler rows.")
          PY

      - name: Upload profiler results
        uses: actions/upload-artifact@v4
        with:
          name: staging-search-phase-profile-${{ github.run_id }}
          path: search_phase_profile.jsonl
          retention-days: 7
          if-no-files-found: error
