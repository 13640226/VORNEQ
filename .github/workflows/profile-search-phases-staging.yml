name: Profile Staging Search Phases

on:
  workflow_dispatch:
    inputs:
      repeat:
        description: Number of repetitions per query
        required: false
        default: "20"

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify staging database secret
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          if [ -z "$STAGING_DATABASE_URL" ]; then
            echo "STAGING_DATABASE_URL is not configured in GitHub Actions secrets." >&2
            exit 1
          fi

      - name: Check migration status
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DJANGO_SETTINGS_MODULE: config.settings_render
        run: |
          python manage.py showmigrations --plan

      - name: Profile search phases
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DJANGO_SETTINGS_MODULE: config.settings_render
        run: |
          set -euo pipefail
          python manage.py profile_search_phases \
            --query "" \
            --query "ai" \
            --query "knowledge" \
            --query "science" \
            --repeat "${{ inputs.repeat }}" \
            --json | tee search_phase_profile.jsonl

      - name: Validate profiler JSONL
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("search_phase_profile.jsonl")
          rows = [json.loads(line) for line in path.read_text().splitlines() if line.strip()]
          if len(rows) != 4:
              raise SystemExit(f"Expected 4 profiler rows, found {len(rows)}")
          required = {"count", "fetch", "merge", "total", "adapters"}
          for row in rows:
              missing = required - row.keys()
              if missing:
                  raise SystemExit(f"Profiler row missing fields: {sorted(missing)}")
          print("Validated 4 search phase profiler rows.")
          PY

      - name: Upload profiler results
        uses: actions/upload-artifact@v4
        with:
          name: staging-search-phase-profile-${{ github.run_id }}
          path: search_phase_profile.jsonl
          retention-days: 7
          if-no-files-found: error
