name: Profile Narrow Window PoC

on:
  workflow_dispatch:
    inputs:
      repeat:
        description: Number of repetitions per scenario
        required: false
        default: "100"
      query:
        description: Search query (empty string profiles the broad path)
        required: false
        default: ""

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify staging database secret
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          if [ -z "$STAGING_DATABASE_URL" ]; then
            echo "STAGING_DATABASE_URL is not configured for the staging environment."
            exit 1
          fi

      - name: Check migration status
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DJANGO_SETTINGS_MODULE: config.settings_render
        run: |
          python manage.py migration_preflight
          python manage.py showmigrations --plan

      - name: Profile narrow window-count scenarios
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DJANGO_SETTINGS_MODULE: config.settings_render
        run: |
          python manage.py profile_narrow_window_poc \
            --repeat "${{ inputs.repeat }}" \
            --query "${{ inputs.query }}" \
            --page 1 \
            --page-size 12 \
            --json > narrow_window_poc_results.json

      - name: Validate diagnostic JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("narrow_window_poc_results.json")
          payload = json.loads(path.read_text())
          assert payload["mode"] == "narrow-window-poc"
          scenarios = payload["scenarios"]
          assert set(scenarios) == {"baseline", "narrow_enrichment", "narrow_cte"}
          for name, data in scenarios.items():
              assert "wall_ms" in data
              assert "sql_ms" in data
              assert "residual_ms" in data
              assert data["avg_db_queries"] >= 1
              assert data["total_results"] >= 0
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - name: Upload diagnostic results
        uses: actions/upload-artifact@v4
        with:
          name: staging-narrow-window-poc-${{ github.run_id }}
          path: narrow_window_poc_results.json
          if-no-files-found: error
          retention-days: 7
