name: DR Staging Rehearsal

on:
  workflow_dispatch:
    inputs:
      confirm_restore:
        description: 'Type "yes" to confirm restoring staging backup into the isolated DR target'
        required: true
        default: 'no'
        type: string

permissions:
  contents: read

concurrency:
  group: dr-staging-rehearsal
  cancel-in-progress: false

jobs:
  rehearse:
    if: ${{ inputs.confirm_restore == 'yes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      RESTORE_DATABASE_URL: ${{ secrets.DR_RESTORE_DATABASE_URL }}
      BACKUP_DIR: ${{ runner.temp }}/vorneq-dr-backups

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DATABASE_URL:-}" || { echo "STAGING_DATABASE_URL is not configured" >&2; exit 1; }
          test -n "${RESTORE_DATABASE_URL:-}" || { echo "DR_RESTORE_DATABASE_URL is not configured" >&2; exit 1; }

      - name: Install PostgreSQL 18 client
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          pg_dump --version
          pg_restore --version

      - name: Guard source and target identity
        id: guard
        shell: bash
        run: |
          set -euo pipefail

          read -r src_host src_port src_db < <(python - <<'PY'
          import os
          from urllib.parse import urlparse
          u = urlparse(os.environ['DATABASE_URL'])
          print((u.hostname or '').lower(), u.port or 5432, (u.path or '').lstrip('/'))
          PY
          )
          read -r dst_host dst_port dst_db < <(python - <<'PY'
          import os
          from urllib.parse import urlparse
          u = urlparse(os.environ['RESTORE_DATABASE_URL'])
          print((u.hostname or '').lower(), u.port or 5432, (u.path or '').lstrip('/'))
          PY
          )

          test -n "$src_host" && test -n "$src_db"
          test -n "$dst_host" && test -n "$dst_db"

          if [[ "$src_host:$src_port/$src_db" == "$dst_host:$dst_port/$dst_db" ]]; then
            echo "Refusing restore: source and target URLs resolve to the same host/port/database." >&2
            exit 1
          fi

          src_identity="$(psql "$DATABASE_URL" -X -At -v ON_ERROR_STOP=1 -c "SELECT COALESCE(inet_server_addr()::text,''), inet_server_port(), current_database(), current_setting('server_version_num')")"
          dst_identity="$(psql "$RESTORE_DATABASE_URL" -X -At -v ON_ERROR_STOP=1 -c "SELECT COALESCE(inet_server_addr()::text,''), inet_server_port(), current_database(), current_setting('server_version_num')")"

          IFS='|' read -r src_addr src_server_port src_database src_version <<<"$src_identity"
          IFS='|' read -r dst_addr dst_server_port dst_database dst_version <<<"$dst_identity"

          if [[ "$src_addr:$src_server_port/$src_database" == "$dst_addr:$dst_server_port/$dst_database" ]]; then
            echo "Refusing restore: source and target identify as the same PostgreSQL database." >&2
            exit 1
          fi

          if (( src_version < 180000 || src_version >= 190000 )); then
            echo "Source is not PostgreSQL 18; refusing rehearsal." >&2
            exit 1
          fi
          if (( dst_version < 180000 || dst_version >= 190000 )); then
            echo "Target is not PostgreSQL 18; refusing rehearsal." >&2
            exit 1
          fi

          echo "Source and target are distinct PostgreSQL 18 databases."
          echo "source_version=$src_version" >> "$GITHUB_OUTPUT"
          echo "target_version=$dst_version" >> "$GITHUB_OUTPUT"

      - name: Capture source verification fingerprints
        id: source
        shell: bash
        run: |
          set -euo pipefail

          schema_sig="$(psql "$DATABASE_URL" -X -At -v ON_ERROR_STOP=1 <<'SQL'
          SELECT md5(COALESCE(string_agg(
            table_schema || '.' || table_name || '.' || column_name || ':' || data_type || ':' || is_nullable || ':' || ordinal_position,
            E'\n' ORDER BY table_schema, table_name, ordinal_position
          ), ''))
          FROM information_schema.columns
          WHERE table_schema = 'public';
          SQL
          )"

          table_count="$(psql "$DATABASE_URL" -X -At -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'")"

          migrations_sig="$(psql "$DATABASE_URL" -X -At -v ON_ERROR_STOP=1 <<'SQL'
          SELECT CASE
            WHEN to_regclass('public.django_migrations') IS NULL THEN 'missing'
            ELSE (
              SELECT count(*)::text || ':' || md5(COALESCE(string_agg(app || ':' || name, E'\n' ORDER BY app, name), ''))
              FROM django_migrations
            )
          END;
          SQL
          )"

          content_types_sig="$(psql "$DATABASE_URL" -X -At -v ON_ERROR_STOP=1 <<'SQL'
          SELECT CASE
            WHEN to_regclass('public.django_content_type') IS NULL THEN 'missing'
            ELSE (
              SELECT count(*)::text || ':' || md5(COALESCE(string_agg(app_label || ':' || model, E'\n' ORDER BY app_label, model), ''))
              FROM django_content_type
            )
          END;
          SQL
          )"

          {
            echo "schema_sig=$schema_sig"
            echo "table_count=$table_count"
            echo "migrations_sig=$migrations_sig"
            echo "content_types_sig=$content_types_sig"
          } >> "$GITHUB_OUTPUT"

      - name: Create staging backup
        id: backup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$BACKUP_DIR"
          t0_epoch="$(date -u +%s)"
          t0_iso="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          bash scripts/postgres_backup.sh backup
          backup_file="$(find "$BACKUP_DIR" -maxdepth 1 -type f -name 'vorneq_*.dump' -print -quit)"
          test -n "$backup_file" && test -s "$backup_file"
          t1_epoch="$(date -u +%s)"
          t1_iso="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "backup_file=$backup_file" >> "$GITHUB_OUTPUT"
          echo "t0_epoch=$t0_epoch" >> "$GITHUB_OUTPUT"
          echo "t1_epoch=$t1_epoch" >> "$GITHUB_OUTPUT"
          echo "t0_iso=$t0_iso" >> "$GITHUB_OUTPUT"
          echo "t1_iso=$t1_iso" >> "$GITHUB_OUTPUT"

      - name: Restore only into isolated DR target
        id: restore
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/postgres_backup.sh --restore "${{ steps.backup.outputs.backup_file }}" --confirm-restore
          t2_epoch="$(date -u +%s)"
          t2_iso="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "t2_epoch=$t2_epoch" >> "$GITHUB_OUTPUT"
          echo "t2_iso=$t2_iso" >> "$GITHUB_OUTPUT"

      - name: Verify restored target
        id: verify
        shell: bash
        run: |
          set -euo pipefail

          target_schema_sig="$(psql "$RESTORE_DATABASE_URL" -X -At -v ON_ERROR_STOP=1 <<'SQL'
          SELECT md5(COALESCE(string_agg(
            table_schema || '.' || table_name || '.' || column_name || ':' || data_type || ':' || is_nullable || ':' || ordinal_position,
            E'\n' ORDER BY table_schema, table_name, ordinal_position
          ), ''))
          FROM information_schema.columns
          WHERE table_schema = 'public';
          SQL
          )"

          target_table_count="$(psql "$RESTORE_DATABASE_URL" -X -At -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'")"

          target_migrations_sig="$(psql "$RESTORE_DATABASE_URL" -X -At -v ON_ERROR_STOP=1 <<'SQL'
          SELECT CASE
            WHEN to_regclass('public.django_migrations') IS NULL THEN 'missing'
            ELSE (
              SELECT count(*)::text || ':' || md5(COALESCE(string_agg(app || ':' || name, E'\n' ORDER BY app, name), ''))
              FROM django_migrations
            )
          END;
          SQL
          )"

          target_content_types_sig="$(psql "$RESTORE_DATABASE_URL" -X -At -v ON_ERROR_STOP=1 <<'SQL'
          SELECT CASE
            WHEN to_regclass('public.django_content_type') IS NULL THEN 'missing'
            ELSE (
              SELECT count(*)::text || ':' || md5(COALESCE(string_agg(app_label || ':' || model, E'\n' ORDER BY app_label, model), ''))
              FROM django_content_type
            )
          END;
          SQL
          )"

          [[ "$target_schema_sig" == "${{ steps.source.outputs.schema_sig }}" ]] || { echo "Schema fingerprint mismatch" >&2; exit 1; }
          [[ "$target_table_count" == "${{ steps.source.outputs.table_count }}" ]] || { echo "Public table count mismatch" >&2; exit 1; }
          [[ "$target_migrations_sig" == "${{ steps.source.outputs.migrations_sig }}" ]] || { echo "Django migration fingerprint mismatch" >&2; exit 1; }
          [[ "$target_content_types_sig" == "${{ steps.source.outputs.content_types_sig }}" ]] || { echo "Django content-type fingerprint mismatch" >&2; exit 1; }

          t3_epoch="$(date -u +%s)"
          t3_iso="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "t3_epoch=$t3_epoch" >> "$GITHUB_OUTPUT"
          echo "t3_iso=$t3_iso" >> "$GITHUB_OUTPUT"
          echo "Restore verification passed."

      - name: Write rehearsal summary
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          t0=${{ steps.backup.outputs.t0_epoch }}
          t1=${{ steps.backup.outputs.t1_epoch }}
          t2=${{ steps.restore.outputs.t2_epoch }}
          t3=${{ steps.verify.outputs.t3_epoch }}
          backup_seconds=$((t1 - t0))
          restore_seconds=$((t2 - t1))
          verify_seconds=$((t3 - t2))
          rto_seconds=$((t3 - t0))
          restore_point_age_seconds=$((t3 - t1))

          {
            echo "## DR Staging Rehearsal"
            echo
            echo "- Result: **PASS**"
            echo "- Source PostgreSQL: 18"
            echo "- Target PostgreSQL: 18"
            echo "- Backup started: ${{ steps.backup.outputs.t0_iso }}"
            echo "- Backup completed / restore point: ${{ steps.backup.outputs.t1_iso }}"
            echo "- Restore completed: ${{ steps.restore.outputs.t2_iso }}"
            echo "- Verification completed: ${{ steps.verify.outputs.t3_iso }}"
            echo "- Backup duration: ${backup_seconds}s"
            echo "- Restore duration: ${restore_seconds}s"
            echo "- Verification duration: ${verify_seconds}s"
            echo "- Rehearsal RTO (backup start through verified recovery): **${rto_seconds}s**"
            echo "- Restore-point age at verification: **${restore_point_age_seconds}s**"
            echo
            echo "> RPO is **not established** by this ad hoc rehearsal. Production RPO depends on the real backup cadence and the age of the available restore point at incident time."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove local backup
        if: ${{ always() }}
        shell: bash
        run: rm -rf "$BACKUP_DIR"
