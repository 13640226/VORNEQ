name: Backup Restore Rehearsal

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

# CI-01 / CI-02 / CI-03: runner steps only orchestrate Docker. The rehearsal
# (including scripts/postgres_backup.sh) runs in the digest-pinned postgres
# image as uid 1001, all capabilities dropped, no-new-privileges, on an
# --internal Docker network that reaches only the disposable database.

jobs:
  postgres-backup-restore:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Start disposable PostgreSQL on an internal network
        run: |
          docker network create --internal ci-db
          docker run -d --name ci-postgres --network ci-db --network-alias postgres \
            -e POSTGRES_USER=vorneq -e POSTGRES_PASSWORD=vorneq -e POSTGRES_DB=source_db \
            --health-cmd "pg_isready -U vorneq -d source_db" --health-interval 2s --health-retries 30 \
            postgres:16@sha256:5db6dac2ef5dcff512f4f00a009c3c332b9f2f28f24277175bf3e4a3d02ef83a
          for i in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' ci-postgres)" = "healthy" ] && break
            sleep 2
          done
          test "$(docker inspect -f '{{.State.Health.Status}}' ci-postgres)" = "healthy"

      - name: Run backup/restore rehearsal without internet
        run: |
          docker run --rm --network ci-db --user 1001:1001 \
            --cap-drop ALL --security-opt no-new-privileges \
            -e PGPASSWORD=vorneq \
            -e DATABASE_URL=postgresql://vorneq:vorneq@postgres:5432/source_db \
            -e RESTORE_DATABASE_URL=postgresql://vorneq:vorneq@postgres:5432/restore_db \
            -e BACKUP_DIR=/tmp/vorneq-backups \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            --entrypoint bash \
            postgres:16@sha256:5db6dac2ef5dcff512f4f00a009c3c332b9f2f28f24277175bf3e4a3d02ef83a \
            /src/scripts/ci_backup_rehearsal.sh

      - name: Remove disposable PostgreSQL
        if: always()
        run: |
          docker rm -f ci-postgres || true
          docker network rm ci-db || true
