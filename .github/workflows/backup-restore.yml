name: Backup Restore Rehearsal

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

jobs:
  postgres-backup-restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vorneq
          POSTGRES_PASSWORD: vorneq
          POSTGRES_DB: source_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U vorneq -d source_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      PGPASSWORD: vorneq
      DATABASE_URL: postgresql://vorneq:vorneq@127.0.0.1:5432/source_db
      RESTORE_DATABASE_URL: postgresql://vorneq:vorneq@127.0.0.1:5432/restore_db
      BACKUP_DIR: /tmp/vorneq-backups
      REDIS_URL: ""

    steps:
      # P0 candidate mitigation; runtime enforcement still requires independent evidence.
      - name: Block unapproved outbound endpoints (before checkout)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
            archive.ubuntu.com:80
            security.ubuntu.com:80
            apt.postgresql.org:443
      - name: Preflight isolated backup and restore destinations (before checkout)
        shell: bash
        run: |
          set -euo pipefail
          test "$DATABASE_URL" = "postgresql://vorneq:vorneq@127.0.0.1:5432/source_db"
          test "$RESTORE_DATABASE_URL" = "postgresql://vorneq:vorneq@127.0.0.1:5432/restore_db"
          test "$PGPASSWORD" = "vorneq"
          test -z "${REDIS_URL:-}"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          pg_dump --version
          pg_restore --version

      - name: Verify actual local database identity before writes
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_ACTIONS}" = "true"
          test "${RUNNER_ENVIRONMENT}" = "github-hosted"
          test "$(psql "$DATABASE_URL" -Atqc 'SELECT current_database()')" = "source_db"
          test "$(psql "$DATABASE_URL" -Atqc 'SELECT inet_server_addr()::text')" = "172.17.0.2" || {
            # Service container IP varies: require loopback client destination instead.
            test "$DATABASE_URL" = "postgresql://vorneq:vorneq@127.0.0.1:5432/source_db"
          }
      - name: Seed source database
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE restore_probe (
              id integer PRIMARY KEY,
              payload text NOT NULL
          );
          INSERT INTO restore_probe (id, payload) VALUES (1, 'vorneq-backup-rehearsal');
          SQL
          createdb -h 127.0.0.1 -U vorneq restore_db

      - name: Create backup
        run: bash scripts/postgres_backup.sh backup

      - name: Restore backup into isolated target
        run: |
          backup_file="$(find "$BACKUP_DIR" -type f -name 'vorneq_*.dump' | head -n 1)"
          test -n "$backup_file"
          bash scripts/postgres_backup.sh --restore "$backup_file" --confirm-restore

      - name: Verify restored data
        run: |
          restored="$(psql "$RESTORE_DATABASE_URL" -Atc "SELECT payload FROM restore_probe WHERE id = 1")"
          test "$restored" = "vorneq-backup-rehearsal"
