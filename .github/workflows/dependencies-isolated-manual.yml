# VORNEQ / PR #482 — isolated dependency audit candidate.
# REVIEW-ONLY: not authorized for merge, CI execution, migration or deploy.
# workflow_dispatch requires this workflow to be on the default branch first.
# This standalone job DOES NOT satisfy the four PR-required status checks.
name: Isolated Dependency Audit — Manual (Non-required)

on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: 'Exact authorized PR #482 head SHA (40 hex chars)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  dependencies-isolated:
    name: dependencies-isolated (manual; not a required PR check)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      REQUESTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
    steps:
      - name: Block outbound connections and revoke elevated access
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          disable-telemetry: true
          disable-sudo-and-containers: true
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443

      - name: Fail-closed authorization and no-privilege preflight
        shell: bash
        run: |
          set -euo pipefail
          expected='6ad9bbf538aa313836f624d2218840bcd8e0d2f5'
          test "$GITHUB_REPOSITORY" = '13640226/VORNEQ'
          test "$GITHUB_EVENT_NAME" = 'workflow_dispatch'
          test "$REQUESTED_HEAD_SHA" = "$expected"
          if command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
            echo '::error::Unexpected sudo permission'; exit 1
          fi
          if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
            echo '::error::Unexpected Docker daemon access'; exit 1
          fi
          for socket in /var/run/docker.sock /run/containerd/containerd.sock; do
            if [ -S "$socket" ] && [ -w "$socket" ]; then
              echo '::error::Writable container socket'; exit 1
            fi
          done

      - name: Check out only the audited commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 6ad9bbf538aa313836f624d2218840bcd8e0d2f5
          persist-credentials: false

      - name: Verify exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '6ad9bbf538aa313836f624d2218840bcd8e0d2f5'
          test -f requirements.txt
          test -f requirements-security.txt

      - name: Set up Python (no cache)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install pinned audit tool only
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'pip-audit==2.10.1'

      - name: Audit application dependencies (no application startup)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip_audit --requirement requirements.txt

      - name: Audit security-tool dependencies (no application startup)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip_audit --requirement requirements-security.txt
