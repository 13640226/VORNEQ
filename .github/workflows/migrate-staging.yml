name: Migrate Staging Database

on:
  workflow_dispatch:
    inputs:
      confirm_migration:
        description: 'Type "yes" to confirm running migrations on staging'
        required: true
        default: 'no'
        type: string

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify staging database secret
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          if [ -z "$STAGING_DATABASE_URL" ]; then
            echo "STAGING_DATABASE_URL is not configured in GitHub Actions secrets." >&2
            exit 1
          fi

      - name: Show migration status
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DJANGO_SETTINGS_MODULE: config.settings_render
        run: python manage.py showmigrations --plan

      - name: Migration preflight
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DJANGO_SETTINGS_MODULE: config.settings_render
        run: python manage.py migration_preflight

      - name: Migration plan
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DJANGO_SETTINGS_MODULE: config.settings_render
        run: python manage.py migrate --plan

      - name: Require explicit migration confirmation
        if: ${{ github.event.inputs.confirm_migration != 'yes' }}
        run: |
          echo 'Migration was not applied because confirm_migration was not exactly "yes".'
          echo 'Re-run this workflow and type "yes" only after reviewing the preflight and migration plan.'

      - name: Apply migrations
        if: ${{ github.event.inputs.confirm_migration == 'yes' }}
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DJANGO_SETTINGS_MODULE: config.settings_render
        run: python manage.py migrate --noinput

      - name: Verify migration status after apply
        if: ${{ github.event.inputs.confirm_migration == 'yes' }}
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DJANGO_SETTINGS_MODULE: config.settings_render
        run: python manage.py showmigrations --plan
