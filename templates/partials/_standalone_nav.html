{% load i18n %}

<header class="standalone-nav" role="banner" aria-label="{% trans 'Site header' %}">
  <div class="standalone-nav__inner">
    <div class="standalone-nav__brand">
      <a href="{% url 'home' %}" class="standalone-nav__wordmark" aria-label="{% trans 'VORNEQ — Knowledge Discovery Platform' %}">
        VORNEQ
      </a>
    </div>

    <nav class="standalone-nav__menu" aria-label="{% trans 'Primary' %}">
      <ul class="standalone-nav__list">
        <li class="standalone-nav__item">
          <a href="{% url 'home' %}"
             class="standalone-nav__link {% if request.resolver_match.url_name == 'home' %}is-active{% endif %}"
             {% if request.resolver_match.url_name == 'home' %}aria-current="page"{% endif %}>
            {% trans "Home" %}
          </a>
        </li>
        <li class="standalone-nav__item">
          <a href="{% url 'marketplace:index' %}"
             class="standalone-nav__link {% if request.resolver_match.namespace == 'marketplace' %}is-active{% endif %}"
             {% if request.resolver_match.namespace == 'marketplace' %}aria-current="page"{% endif %}>
            {% trans "Marketplace" %}
          </a>
        </li>
      </ul>
    </nav>

    <div class="standalone-nav__actions">
      {% if user.is_authenticated %}
        <a href="{% url 'profile' %}"
           class="standalone-nav__user"
           aria-label="{% trans 'Open profile' %}"
           {% if request.resolver_match.url_name == 'profile' %}aria-current="page"{% endif %}>
          {% if user.profile_data.avatar %}
            <img class="standalone-nav__user-image" src="{% url 'profile_avatar' %}" alt="" width="44" height="44">
          {% else %}
            {{ user.get_short_name|default:user.username|slice:":2"|upper }}
          {% endif %}
        </a>
        <a href="{% url 'account_logout' %}" class="standalone-nav__action standalone-nav__action--logout">
          {% trans "Sign out" %}
        </a>
      {% else %}
        <a href="{% url 'account_login' %}" class="standalone-nav__action standalone-nav__action--login">
          {% trans "Sign in" %}
        </a>
      {% endif %}
    </div>
  </div>
</header>
